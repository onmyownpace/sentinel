# Compose runs PostgreSQL and n8n by default (API/web usually on the host for reload).
# Profile `app` adds containerized API + web (ENG-4).
# Profile `mail` adds Mailpit (AUTO-3).
# Named volumes are preserved across `docker compose down` — never use `-v` unless
# you intend to wipe local Postgres/n8n data.
# Redis and Celery are intentionally absent.

name: sentinel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sentinel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ keeps Compose from eating the variable. The shell inside the
      # container expands POSTGRES_USER and POSTGRES_DB.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  n8n:
    image: n8nio/n8n:2.46.7
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    # The workflow calls Sentinel on the Docker host, not on localhost inside
    # the container. host-gateway is required on Docker Engine for that name.
    # When the API runs in Compose (profile `app`), prefer http://api:8000 in
    # the workflow API address node instead of host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: UTC
    volumes:
      # n8n's own SQLite database and editor account. Not Sentinel's Postgres.
      - sentinel_n8n_data:/home/node/.n8n
      - ./n8n/workflows:/files:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  # Free local mail sink (AUTO-3). Not started by default.
  # Bring up with: docker compose --profile mail up -d
  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test:
        [
          "CMD",
          "/mailpit",
          "readyz",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Containerized API (ENG-4). Opt-in: docker compose --profile app up -d --build
  api:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@postgres:5432/${POSTGRES_DB:-sentinel}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-simulated}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SCHEDULE_CHECK_TOKEN: ${SCHEDULE_CHECK_TOKEN:-change-me-schedule-token}
      AUTOMATION_TOKEN: ${AUTOMATION_TOKEN:-change-me-automation-token}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-dev@sentinel.local}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-dev-password-change-me}
      SCREENSHOT_ENABLED: ${SCREENSHOT_ENABLED:-true}
      SCREENSHOT_DIR: /app/data/screenshots
      CHECK_NAVIGATION_TIMEOUT_SECONDS: ${CHECK_NAVIGATION_TIMEOUT_SECONDS:-15}
      JOURNEY_BUDGET_SECONDS: ${JOURNEY_BUDGET_SECONDS:-45}
    volumes:
      - sentinel_api_screenshots:/app/data/screenshots
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Containerized Next.js UI (ENG-4). Same profile as api.
  web:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  sentinel_postgres_data:
  sentinel_n8n_data:
  sentinel_api_screenshots:
