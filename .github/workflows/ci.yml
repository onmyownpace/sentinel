# ENG-1: free GitHub Actions CI — pytest + frontend typecheck/build.
# Uses disposable CI env values only. Do not echo secrets or dump env.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI values only — not production secrets. Never print these.
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel
      ENVIRONMENT: test
      ANALYSIS_PROVIDER: simulated
      OPENAI_API_KEY: ""
      SCHEDULE_CHECK_TOKEN: ci-schedule-token
      AUTOMATION_TOKEN: ci-automation-token
      SEED_USER_EMAIL: ci@sentinel.local
      SEED_USER_PASSWORD: ci-password-not-for-production
      SCREENSHOT_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install API (with test extras)
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        # -q keeps token/password noise out of logs; failures still show asserts.
        run: python -m pytest -q --tb=short

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          # Next may read public env later; keep empty and never dump secrets.
          CI: "true"
